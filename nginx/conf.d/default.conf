# HTTP — redirect to HTTPS once cert is ready, serve certbot challenge
server {
    listen 80;
    server_name medhistry.com www.medhistry.com;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Before SSL cert exists, proxy to API so the app works on HTTP too
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name medhistry.com www.medhistry.com;

    ssl_certificate     /etc/letsencrypt/live/medhistry.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medhistry.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 50M;

    # API
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Health check
    location /health {
        proxy_pass http://api:8000/health;
    }

    # Root — simple landing or redirect
    location / {
        return 200 '{"status": "MedHistry API is running"}';
        add_header Content-Type application/json;
    }
}
