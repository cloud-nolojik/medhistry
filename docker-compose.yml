version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: medhistry-db
    environment:
      POSTGRES_USER: medhistry
      POSTGRES_PASSWORD: medhistry
      POSTGRES_DB: medhistry
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medhistry"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: medhistry-api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://medhistry:medhistry@db:5432/medhistry
      SECRET_KEY: dev-secret-change-in-production
      QR_TOKEN_SECRET: dev-qr-secret-change-in-production
      DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/code/app  # Hot reload

volumes:
  pgdata:
