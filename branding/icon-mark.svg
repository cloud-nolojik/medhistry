<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A5C"/>
      <stop offset="100%" stop-color="#1A6B6A"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2EC4B6"/>
      <stop offset="100%" stop-color="#1A6B6A"/>
    </linearGradient>
    <linearGradient id="innerShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E4D6E"/>
      <stop offset="50%" stop-color="#1A6B6A"/>
      <stop offset="100%" stop-color="#2EC4B6"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#45D9CB"/>
      <stop offset="100%" stop-color="#2EC4B6"/>
    </linearGradient>
    <linearGradient id="brainStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0FFFC"/>
      <stop offset="100%" stop-color="#45D9CB"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="crossGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer Shield Shape -->
  <path d="M256 42 L420 120 C430 125 436 136 436 148 L436 280 C436 340 400 396 346 430 L268 478 C260 483 252 483 244 478 L166 430 C112 396 76 340 76 280 L76 148 C76 136 82 125 92 120 Z"
        fill="url(#shieldGrad)" opacity="0.93"/>

  <!-- Inner Shield highlight -->
  <path d="M256 72 L396 140 C404 144 408 152 408 162 L408 274 C408 326 378 374 332 404 L264 446 C260 448 252 448 248 446 L180 404 C134 374 104 326 104 274 L104 162 C104 152 108 144 116 140 Z"
        fill="url(#innerShield)" opacity="0.2"/>

  <!-- Connection nodes on shield perimeter -->
  <circle cx="256" cy="42" r="13" fill="url(#nodeGrad)" filter="url(#glow)"/>
  <circle cx="420" cy="120" r="11" fill="url(#nodeGrad)" filter="url(#glow)"/>
  <circle cx="436" cy="220" r="11" fill="url(#nodeGrad)" filter="url(#glow)"/>
  <circle cx="346" cy="430" r="11" fill="url(#nodeGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="478" r="13" fill="url(#nodeGrad)" filter="url(#glow)"/>
  <circle cx="166" cy="430" r="11" fill="url(#nodeGrad)" filter="url(#glow)"/>
  <circle cx="76" cy="220" r="11" fill="url(#nodeGrad)" filter="url(#glow)"/>
  <circle cx="92" cy="120" r="11" fill="url(#nodeGrad)" filter="url(#glow)"/>

  <!-- Connection lines between shield nodes -->
  <line x1="256" y1="42" x2="420" y2="120" stroke="#2EC4B6" stroke-width="2" opacity="0.3"/>
  <line x1="420" y1="120" x2="436" y2="220" stroke="#2EC4B6" stroke-width="2" opacity="0.3"/>
  <line x1="92" y1="120" x2="76" y2="220" stroke="#2EC4B6" stroke-width="2" opacity="0.3"/>
  <line x1="256" y1="42" x2="92" y2="120" stroke="#2EC4B6" stroke-width="2" opacity="0.3"/>

  <!-- ═══ MEDICAL CROSS (bolder, more visible) ═══ -->
  <g transform="translate(256, 252) scale(1.35)" filter="url(#crossGlow)">
    <!-- Vertical bar of cross -->
    <rect x="-24" y="-80" width="48" height="160" rx="9" fill="url(#crossGrad)" opacity="0.45"/>
    <!-- Horizontal bar of cross -->
    <rect x="-80" y="-24" width="160" height="48" rx="9" fill="url(#crossGrad)" opacity="0.45"/>
    <!-- Brighter inner cross for depth -->
    <rect x="-18" y="-70" width="36" height="140" rx="7" fill="#45D9CB" opacity="0.2"/>
    <rect x="-70" y="-18" width="140" height="36" rx="7" fill="#45D9CB" opacity="0.2"/>
  </g>

  <!-- ═══ BRAIN + NEURAL NETWORK (on top of cross) ═══ -->
  <g transform="translate(256, 248) scale(1.45)" filter="url(#softGlow)">

    <!-- Brain fill (dark backdrop so cross doesn't bleed through) -->
    <path d="M0 -58 C-42 -56 -62 -36 -64 -10 C-68 16 -54 32 -40 40 C-44 46 -42 54 -32 58 C-22 62 -12 58 -4 50 C-4 58 4 58 4 50 C12 58 22 62 32 58 C42 54 44 46 40 40 C54 32 68 16 64 -10 C62 -36 42 -56 0 -58Z"
          fill="#1A5060" opacity="0.7"/>

    <!-- Brain outline - left hemisphere (compact, no flare) -->
    <path d="M-4 -58 C-42 -56 -62 -36 -64 -10 C-68 16 -54 32 -40 40 C-44 46 -42 54 -32 58 C-22 62 -12 58 -4 50"
          fill="none" stroke="url(#brainStroke)" stroke-width="5" stroke-linecap="round"/>
    <!-- Brain outline - right hemisphere -->
    <path d="M4 -58 C42 -56 62 -36 64 -10 C68 16 54 32 40 40 C44 46 42 54 32 58 C22 62 12 58 4 50"
          fill="none" stroke="url(#brainStroke)" stroke-width="5" stroke-linecap="round"/>
    <!-- Brain stem (minimal) -->
    <path d="M-4 50 C-4 58 4 58 4 50" fill="none" stroke="url(#brainStroke)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Neural network nodes (6 key nodes, large and bold) -->
    <circle cx="0" cy="-44" r="8.5" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="-35" cy="-26" r="7.5" fill="#FFFFFF" opacity="0.92"/>
    <circle cx="35" cy="-26" r="7.5" fill="#FFFFFF" opacity="0.92"/>
    <circle cx="0" cy="8" r="9.5" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="-40" cy="16" r="6.5" fill="#FFFFFF" opacity="0.88"/>
    <circle cx="40" cy="16" r="6.5" fill="#FFFFFF" opacity="0.88"/>

    <!-- Neural connections (clean triangle pattern) -->
    <!-- Top triangle -->
    <line x1="0" y1="-44" x2="-35" y2="-26" stroke="#FFFFFF" stroke-width="2.5" opacity="0.6"/>
    <line x1="0" y1="-44" x2="35" y2="-26" stroke="#FFFFFF" stroke-width="2.5" opacity="0.6"/>
    <!-- Mid connections to center -->
    <line x1="-35" y1="-26" x2="0" y2="8" stroke="#FFFFFF" stroke-width="2.5" opacity="0.5"/>
    <line x1="35" y1="-26" x2="0" y2="8" stroke="#FFFFFF" stroke-width="2.5" opacity="0.5"/>
    <!-- Side nodes to center -->
    <line x1="-40" y1="16" x2="0" y2="8" stroke="#FFFFFF" stroke-width="2.5" opacity="0.45"/>
    <line x1="40" y1="16" x2="0" y2="8" stroke="#FFFFFF" stroke-width="2.5" opacity="0.45"/>
    <!-- Outer vertical connections -->
    <line x1="-35" y1="-26" x2="-40" y2="16" stroke="#FFFFFF" stroke-width="2" opacity="0.35"/>
    <line x1="35" y1="-26" x2="40" y2="16" stroke="#FFFFFF" stroke-width="2" opacity="0.35"/>
  </g>
</svg>